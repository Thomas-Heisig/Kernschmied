[alembic]
# script_location should be relative to the backend working directory
script_location = migrations
# use a relative SQLite URL when running alembic from the backend/ folder
sqlalchemy.url = sqlite:///data/kernschmied.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
