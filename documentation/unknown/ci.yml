name: CI

on:
  push:
    branches: [ 'master', 'main' ]
  pull_request:
    branches: [ 'master', 'main' ]

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then python -m pip install -r backend/requirements.txt; fi
          python -m pip install ruff mypy bandit pip-audit

      - name: Ruff (lint)
        run: |
          python -m ruff check backend || true

      - name: Mypy (type check)
        run: |
          python -m mypy backend || true

      - name: Pytest
        run: |
          python -m pytest -q

      - name: Bandit (security scan)
        run: |
          python -m bandit -r backend -f text -lll || true

      - name: pip-audit (dependency audit)
        run: |
          python -m pip_audit --progress=text || true

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: ESLint
        working-directory: frontend
        run: |
          npm run lint --if-present || true

      - name: TypeScript build
        working-directory: frontend
        run: |
          npm run build --silent

      - name: Vitest
        working-directory: frontend
        run: |
          npm run test --silent || true
