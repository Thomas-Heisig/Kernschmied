services:
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: kernschmied-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    volumes:
      - mailpit-data:/data

volumes:
  mailpit-data: